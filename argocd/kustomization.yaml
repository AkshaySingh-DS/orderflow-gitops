apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Existing OrderFlow Argo CD resources
  - project.yaml
  - application.yaml

  # Observability security boundary
  - projects/observability.yaml

  # Observability base components
  - applications/observability/kube-prometheus-stack.yaml
  - applications/observability/loki.yaml
  - applications/observability/alloy.yaml

  # Enable in a follow-up commit, after the monitoring stack
  # is healthy and the required Prometheus Operator CRDs exist.
  - applications/observability/observability-resources.yaml