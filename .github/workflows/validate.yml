name: GitOps Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitops-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Helm and Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.0

      - name: Lint Helm chart
        run: |
          helm lint helm/orderflow \
            -f helm/orderflow/values-dev.yaml \
            --strict

      - name: Render Kubernetes manifests
        run: |
          helm template orderflow helm/orderflow \
            -f helm/orderflow/values-dev.yaml \
            > /tmp/orderflow-rendered.yaml

      - name: Check rendered manifest is non-empty
        run: test -s /tmp/orderflow-rendered.yaml

      - name: Verify Git whitespace
        run: git diff --check
