
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: orderflow-alert-lifecycle-test
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: orderflow
spec:
  groups:
    - name: orderflow.alert-lifecycle-test
      rules:
        - alert: OrderFlowAlertLifecycleTest
          expr: vector(1) > 2
          for: 1m
          labels:
            service: orderflow
            severity: test
          annotations:
            summary: Temporary OrderFlow alert lifecycle test
            description: Synthetic alert used to validate Pending, Firing, and recovery. No API incident is implied.
