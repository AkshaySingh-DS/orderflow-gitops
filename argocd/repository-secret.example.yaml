# Example only. NEVER commit a real GitHub App private key to Git.
# Create the real Secret directly in the argocd namespace during bootstrap.
apiVersion: v1
kind: Secret
metadata:
  name: orderflow-gitops-repository
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/REPLACE_WITH_GITHUB_OWNER/orderflow-gitops
  githubAppID: "REPLACE_WITH_ARGOCD_READ_ONLY_APP_ID"
  githubAppInstallationID: "REPLACE_WITH_INSTALLATION_ID"
  githubAppPrivateKey: |
    REPLACE_WITH_PRIVATE_KEY
