replicaCount: 2

image:
  repository: REPLACE_WITH_ECR_REGISTRY/orderflow-api
  tag: bootstrap
  pullPolicy: IfNotPresent
  pullSecrets:
    - name: ecr-pull-secret

serviceAccount:
  create: true
  name: ""

environment:
  ENVIRONMENT: production
  LOG_LEVEL: INFO

existingSecretName: orderflow-db-secret
existingSecretKey: DATABASE_URL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  className: traefik
  host: orderflow.local
  path: /
  pathType: Prefix

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  cpuUtilization: 70

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  startup:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 12
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

migrations:
  enabled: true
  backoffLimit: 4

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  servicePort: 5432
  existingSecretName: orderflow-db-secret
  databaseKey: POSTGRES_DB
  usernameKey: POSTGRES_USER
  passwordKey: POSTGRES_PASSWORD
  storage:
    size: 5Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi


podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

terminationGracePeriodSeconds: 30
