apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: observability
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.9.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/addons/observability/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/AkshaySingh-DS/orderflow-gitops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true #kube-prometheus-stack chart is being rejected because its Prometheus 
      # Operator CRDs exceed Kubernetes' 256 KiB client-side apply annotation limit.
