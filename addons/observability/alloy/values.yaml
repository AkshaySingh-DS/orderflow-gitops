# Alloy collects logs through the Kubernetes API. This avoids privileged hostPath
# mounts in the single-node portfolio cluster, with a trade-off of extra API traffic.
controller:
  type: deployment
  replicas: 1
  revisionHistoryLimit: 3

alloy:
  enableReporting: false
  storagePath: /tmp/alloy
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi
  configMap:
    create: true
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }

        rule {
          target_label = "cluster"
          replacement  = "orderflow-k3s"
        }

        rule {
          target_label = "environment"
          replacement  = "dev"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pod_logs.receiver]
      }

      loki.process "pod_logs" {
        # Keep a small set of stable labels; do not label by request ID/order ID.
        stage.static_labels {
          values = {
            cluster     = "orderflow-k3s",
            environment = "dev",
          }
        }
        forward_to = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }

rbac:
  create: true
serviceAccount:
  create: true
  automountServiceAccountToken: true
