# Small single-node portfolio profile: monolithic Loki + persistent local-path PVC.
# For multi-node production, use S3/object storage and the distributed architecture.
deploymentMode: Monolithic

auth_enabled: false
loki:
  auth_enabled: false
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 168h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
    working_directory: /var/loki/compactor

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: local-path
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    enableStatefulSetAutoDeletePVC: false
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

gateway:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Monolithic mode requires other mutually exclusive targets to be zeroed.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0

# Keep the portfolio installation small; the dashboard uses Prometheus for Loki metrics.
lokiCanary:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
monitoring:
  dashboards:
    enabled: false
  rules:
    enabled: false
test:
  enabled: false
minio:
  enabled: false
