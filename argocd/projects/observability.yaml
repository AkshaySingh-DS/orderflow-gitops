# This creates a dedicated Argo CD project to govern the observability stack. It restricts deployment 
# destinations to the monitoring namespace and allows only the repositories needed for the Helm charts
#  and your GitOps configuration.

apiVersion: argoproj.io/v1alpha1
kind: AppProject

metadata:
  name: observability
  namespace: argocd

spec:
  description: >-
    OrderFlow observability platform including Prometheus, Grafana,
    Loki, Alloy, dashboards and alerting resources.

  sourceRepos:
    - https://github.com/AkshaySingh-DS/orderflow-gitops
    - https://prometheus-community.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts

  destinations:
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: kube-system

  # Permit only the cluster-scoped resources required by the
  # monitoring stack and Prometheus Operator.
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition

    - group: rbac.authorization.k8s.io
      kind: ClusterRole

    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration

    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration

  # Explicit allow-list of namespaced resources managed by the stack.
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: Endpoints

    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: DaemonSet

    - group: batch
      kind: Job

    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding

    - group: policy
      kind: PodDisruptionBudget

    - group: monitoring.coreos.com
      kind: Alertmanager
    - group: monitoring.coreos.com
      kind: AlertmanagerConfig
    - group: monitoring.coreos.com
      kind: Prometheus
    - group: monitoring.coreos.com
      kind: PrometheusAgent
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PodMonitor
    - group: monitoring.coreos.com
      kind: Probe
    - group: monitoring.coreos.com
      kind: ScrapeConfig
    - group: monitoring.coreos.com
      kind: ThanosRuler